<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#FAF8F0;}
a{color:#004CE5;text-decoration:none;}
a:hover{color:#004CE5;text-decoration:underline;}
</style>
</helmet>
<div data-screen-label="Advisor" style="min-height:100vh;background:#FAF8F0;color:#061541;font-family:'Inter',sans-serif;display:flex;flex-direction:column;">
  <div style="padding:0 clamp(24px,4vw,64px);display:flex;flex-direction:column;flex:1;">
    <dc-import name="SiteHeader" active="advisor" hint-size="100%,80px"></dc-import>

    <section style="position:relative;display:flex;flex-direction:column;gap:10px;padding:22px 0 18px;border-bottom:2px solid #061541;">
      <nav aria-label="Breadcrumb" style="display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;font-family:'Inter',sans-serif;font-weight:700;font-size:clamp(10px,0.8vw,13px);letter-spacing:0.08em;text-transform:uppercase;color:#061541;"><a href="Home.dc.html" style="color:#061541;text-decoration:none;" style-hover="text-decoration:underline;">Home</a><span style="color:#A8B3CB;">/</span><span>Advisor</span></nav>
      <h1 style="margin:0;display:flex;align-items:flex-start;gap:12px;font-family:'Pixelify Sans',monospace;font-weight:700;font-size:clamp(34px,3.6vw,60px);line-height:1;color:#061541;">{{ page.title }}<span style="color:#FFDC45;font-size:0.45em;line-height:1;margin-top:0.15em;-webkit-text-stroke:1.5px #061541;paint-order:stroke fill;">♥</span></h1>
      <img src="uploads/advisor-cat-transparent.png" alt="Sleeping cat" style="position:absolute;right:0;bottom:0;height:clamp(64px,6.5vw,104px);width:auto;image-rendering:pixelated;display:block;">
    </section>

    <section style="display:grid;grid-template-columns:150px minmax(0,1fr);gap:24px;padding:34px 0 40px;">
      <aside style="display:flex;flex-direction:column;gap:0;border-right:2px solid #061541;padding-right:16px;">
        <button type="button" onClick="{{ toggleLikedFilter }}" style="display:flex;align-items:center;gap:10px;background:none;border:none;padding:0 0 22px 2px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;font-size:16px;color:#1D4ED8;text-align:left;">
          <span style="font-size:20px;line-height:1;color:{{ likedFilterColor }};">{{ likedGlyph }}</span> Liked
        </button>
        <div style="position:relative;padding-left:22px;display:flex;flex-direction:column;gap:22px;">
          <div style="position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:#061541;"></div>
          <sc-for list="{{ years }}" as="y" hint-placeholder-count="3">
            <div style="display:flex;flex-direction:column;gap:6px;">
              <button type="button" onClick="{{ y.select }}" style="display:flex;align-items:center;gap:12px;background:none;border:none;padding:0;cursor:pointer;font-family:'Inter',sans-serif;font-weight:700;font-size:17px;color:#061541;text-align:left;position:relative;">
                <span style="position:absolute;left:-22px;width:12px;height:12px;border:2px solid #061541;background:{{ y.dot }};box-sizing:border-box;"></span>{{ y.label }}
              </button>
            </div>
          </sc-for>
        </div>
      </aside>

      <div style="display:flex;flex-direction:column;gap:22px;">
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;">
          <sc-for list="{{ visible }}" as="p" hint-placeholder-count="9">
            <article style="display:flex;flex-direction:column;background:{{ p.border }};padding:2px;clip-path:polygon(6px 0,calc(100% - 6px) 0,calc(100% - 6px) 3px,calc(100% - 3px) 3px,calc(100% - 3px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 3px) calc(100% - 6px),calc(100% - 3px) calc(100% - 3px),calc(100% - 6px) calc(100% - 3px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 3px),3px calc(100% - 3px),3px calc(100% - 6px),0 calc(100% - 6px),0 6px,3px 6px,3px 3px,6px 3px);">
              <div style="flex:1;background:#FFFDF8;padding:8px;display:flex;flex-direction:column;gap:12px;clip-path:polygon(6px 0,calc(100% - 6px) 0,calc(100% - 6px) 3px,calc(100% - 3px) 3px,calc(100% - 3px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 3px) calc(100% - 6px),calc(100% - 3px) calc(100% - 3px),calc(100% - 6px) calc(100% - 3px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 3px),3px calc(100% - 3px),3px calc(100% - 6px),0 calc(100% - 6px),0 6px,3px 6px,3px 3px,6px 3px);">
                <div role="img" aria-label="{{ p.title }}" style="width:100%;aspect-ratio:1/0.92;background-color:#E9EEF8;background-image:{{ p.bg }};background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#6B7A9C;">{{ p.placeholder }}</div>
                <div style="display:flex;align-items:center;gap:12px;padding:2px 4px 6px;margin-top:auto;">
                  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
                    <div style="font-weight:600;font-size:15px;color:#061541;line-height:1.3;">{{ p.title }}</div>
                    <div style="font-size:13px;color:#1D4ED8;">{{ p.dateLabel }}</div>
                  </div>
                  <button type="button" onClick="{{ p.toggle }}" aria-label="Like" style="flex:none;background:none;border:none;padding:4px;cursor:pointer;font-size:22px;line-height:1;color:{{ p.heartColor }};font-family:'Inter',sans-serif;">{{ p.heart }}</button>
                </div>
              </div>
            </article>
          </sc-for>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:6px;">
          <div style="font-size:15px;color:#1D4ED8;">{{ showingLabel }}</div>
          <sc-if value="{{ hasMore }}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{ loadMore }}" style="display:inline-flex;align-items:center;gap:12px;background:#FFDC45;color:#061541;border:2px solid #061541;box-shadow:inset 0 2px 0 #FFF0A3, inset 0 -2px 0 #E0B81F;padding:10px 24px;font-family:'Inter',sans-serif;font-weight:700;font-size:16px;cursor:pointer;" style-hover="filter:brightness(1.04);">Load more <span style="line-height:1;">↓</span></button>
          </sc-if>
        </div>
      </div>
    </section>

    <footer style="margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0 28px;border-top:2px solid #061541;font-weight:700;font-size:13px;">
      <a href="Home.dc.html" style="display:inline-flex;align-items:center;gap:10px;color:#061541;"><span style="font-size:1.3em;line-height:1;">←</span> Back to the board</a>
      <div style="letter-spacing:0.08em;font-weight:400;color:#1D4ED8;">PITTSBURGH · THERE IS ALWAYS A NEXT MOVE</div>
    </footer>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { data: null, liked: new Set(), likedOnly: false, year: null, shown: 9 };
  async componentDidMount() {
    const mod = await import('./advisorData.js');
    this.setState({ data: mod.advisor, liked: new Set(mod.advisor.initiallyLiked || []) });
  }
  renderVals() {
    const d = this.state.data;
    if (!d) return {};
    const { liked, likedOnly, year, shown } = this.state;
    const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const fmt = (s) => { const [y, m, dd] = s.split('-'); return `${MON[+m - 1]} ${+dd}, ${y}`; };
    const sorted = [...d.photos].sort((a, b) => b.date.localeCompare(a.date));
    const yearsList = [...new Set(sorted.map((p) => p.date.slice(0, 4)))];
    const activeYear = year ?? yearsList[0];
    const years = yearsList.map((y) => ({
      label: y, open: y === activeYear, dot: y === activeYear ? '#FFDC45' : '#FFFDF8',
      months: [...new Set(sorted.filter((p) => p.date.startsWith(y)).map((p) => MON[+p.date.slice(5, 7) - 1]))],
      select: () => this.setState({ year: y, shown: 9 }),
    }));
    const filtered = sorted.filter((p) => (!likedOnly || liked.has(p.id)) && (!year || p.date.startsWith(year)));
    const visible = filtered.slice(0, shown).map((p) => {
      const isLiked = liked.has(p.id);
      return {
        ...p, dateLabel: fmt(p.date), heart: isLiked ? '♥' : '♡', heartColor: isLiked ? '#F0B400' : '#1D4ED8',
        border: isLiked ? '#FFDC45' : '#061541',
        bg: p.img ? `url(${p.img})` : 'repeating-linear-gradient(45deg,#E9EEF8 0 10px,#DFE6F4 10px 20px)',
        placeholder: p.img ? '' : 'cat photo',
        toggle: () => { const s = new Set(this.state.liked); s.has(p.id) ? s.delete(p.id) : s.add(p.id); this.setState({ liked: s }); },
      };
    });
    return {
      page: d, years, visible,
      likedGlyph: likedOnly ? '♥' : '♡', likedFilterColor: likedOnly ? '#F0B400' : '#1D4ED8',
      toggleLikedFilter: () => this.setState({ likedOnly: !likedOnly, shown: 9 }),
      showingLabel: `Showing ${Math.min(shown, filtered.length)} of ${filtered.length} memories`,
      hasMore: filtered.length > shown,
      loadMore: () => this.setState({ shown: shown + 9 }),
    };
  }
}
</script>
</body>
</html>
