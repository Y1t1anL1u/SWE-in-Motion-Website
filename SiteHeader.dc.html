<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</helmet>
<header style="max-width:{{ maxWidth }};margin:0 auto;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;color:#061541;"><div style="display:flex;align-items:center;justify-content:space-between;padding:clamp(14px,1.4vw,22px) 0 clamp(8px,0.8vw,12px);border-bottom:2px solid #061541;">
  <a href="Home.dc.html" style="display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(22px,1.8vw,28px);color:#061541;text-decoration:none;" style-hover="text-decoration:none;">
    <img src="uploads/logo-dice.png" alt="" style="width:44px;height:44px;object-fit:contain;image-rendering:pixelated;display:block;margin-left:-3px;">
    Yitian
  </a>
  <nav style="display:flex;align-items:center;gap:clamp(20px,2.6vw,40px);font-weight:700;font-size:clamp(13px,0.95vw,15px);">
    <a href="Home.dc.html" style="color:#061541;padding-bottom:3px;border-bottom:3px solid {{ aboutLine }};text-decoration:none;" style-hover="border-bottom:3px solid #061541;text-decoration:none;">About</a>
    <a href="Projects.dc.html" style="color:#061541;padding-bottom:3px;border-bottom:3px solid {{ projectsLine }};text-decoration:none;" style-hover="border-bottom:3px solid #061541;text-decoration:none;">Projects</a>
    <a href="Resume.dc.html" style="color:#061541;padding-bottom:3px;border-bottom:3px solid {{ resumeLine }};text-decoration:none;" style-hover="border-bottom:3px solid #061541;text-decoration:none;">Resume</a>
    <a href="Advisor.dc.html" style="color:#061541;padding-bottom:3px;border-bottom:3px solid {{ advisorLine }};text-decoration:none;" style-hover="border-bottom:3px solid #061541;text-decoration:none;">Advisor</a>
  </nav>
</div></header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:80},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;projects&quot;,&quot;tsType&quot;:&quot;'about'|'projects'|'resume'|'advisor'&quot;,&quot;options&quot;:[&quot;about&quot;,&quot;projects&quot;,&quot;resume&quot;,&quot;advisor&quot;]}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'projects';
    const line = (k) => (a === k ? '#FFDC45' : 'transparent');
    return { maxWidth: this.props.maxWidth ?? 'none', aboutLine: line('about'), projectsLine: line('projects'), resumeLine: line('resume'), advisorLine: line('advisor') };
  }
}
</script>
</body>
</html>
