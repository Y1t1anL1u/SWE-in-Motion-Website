<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#FAF8F0;}
a{color:#004CE5;text-decoration:none;}
a:hover{color:#004CE5;text-decoration:underline;}
</style>
</helmet>
<div data-screen-label="Project detail" style="min-height:100vh;background:#FAF8F0;color:#061541;font-family:'Inter',sans-serif;">
  <div style="padding:0 clamp(24px,4vw,64px) 48px;box-sizing:border-box;">

    <dc-import name="SiteHeader" active="projects" hint-size="100%,80px"></dc-import>

    <section style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,58%);gap:0;align-items:start;padding:12px 0 0;border-bottom:1px solid #A8B3CB;">
      <div style="display:flex;flex-direction:column;gap:clamp(8px,0.9vw,14px);padding:clamp(14px,1.4vw,22px) 0 clamp(10px,1vw,16px);position:relative;z-index:1;white-space:nowrap;">
        <nav aria-label="Breadcrumb" style="display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;font-family:'Inter',sans-serif;font-weight:700;font-size:clamp(10px,0.8vw,13px);letter-spacing:0.08em;text-transform:uppercase;color:#061541;"><a href="Home.dc.html" style="color:#061541;text-decoration:none;" style-hover="text-decoration:underline;">Home</a><span style="color:#A8B3CB;">/</span><a href="Projects.dc.html" style="color:#061541;text-decoration:none;" style-hover="text-decoration:underline;">Projects</a><span style="color:#A8B3CB;">/</span><span>{{ project.categoryName }}</span></nav>
        <h1 style="margin:0;font-family:'Pixelify Sans',monospace;font-weight:700;font-size:clamp(34px,3.6vw,60px);line-height:1;letter-spacing:-0.01em;">{{ project.title }}</h1>
        <sc-if value="{{ hasSummary }}" hint-placeholder-val="{{ false }}">
          <p style="margin:0;font-size:16px;line-height:1.4;color:#34466E;text-wrap:pretty;max-width:34ch;">{{ project.summary }}</p>
        </sc-if>
        <sc-if value="{{ hasActions }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:2px;">
            <sc-for list="{{ project.actions }}" as="a" hint-placeholder-count="2">
              <a href="{{ a.href }}" target="{{ a.target }}" style="font-size:15px;font-weight:600;color:#004CE5;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;">{{ a.label }} ↗</a>
            </sc-for>
          </div>
        </sc-if>
      </div>
      <div role="img" aria-label="{{ project.hero.alt }}" style="width:100%;height:clamp(100px,8.5vw,140px);background-image:url({{ project.hero.src }});background-size:cover;background-position:{{ project.hero.pos }};image-rendering:pixelated;-webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,0.2) 25%,#000 55%);mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,0.2) 25%,#000 55%);"></div>
    </section>

    <main style="width:100%;padding-top:32px;display:flex;flex-direction:column;gap:44px;">
      <div style="display:flex;flex-direction:column;gap:20px;">
        <sc-for list="{{ project.subprojects }}" as="sp" hint-placeholder-count="3">
          <section style="background:#061541;padding:2px;clip-path:polygon(8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px),0 8px,4px 8px,4px 4px,8px 4px);">
            <div style="display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 18px;align-items:start;padding:20px 22px 18px;background:#FFFFFF;clip-path:polygon(8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px),0 8px,4px 8px,4px 4px,8px 4px);">
              <div style="display:flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 6px;background:#EEF2FA;color:#3B63B3;font-family:'Inter',sans-serif;font-weight:700;font-size:13px;">{{ sp.num }}</div>
              <h2 style="margin:0;padding-top:3px;font-family:'Inter',sans-serif;font-weight:700;font-size:clamp(19px,1.6vw,24px);line-height:1.25;letter-spacing:-0.01em;color:#061541;text-wrap:balance;">{{ sp.title }}</h2>
              <div style="grid-column:3;grid-row:1 / span 2;display:flex;flex-direction:column;align-items:flex-end;gap:10px;padding-top:6px;">
                <a href="{{ sp.githubHref }}" target="_blank" rel="noopener" aria-disabled="{{ sp.githubDisabled }}" style="font-size:14px;font-weight:700;color:{{ sp.githubColor }};text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;white-space:nowrap;pointer-events:{{ sp.githubPointer }};">GitHub ↗</a>
                <sc-if value="{{ sp.hasDemo }}" hint-placeholder-val="{{ false }}">
                  <a href="{{ sp.demo }}" style="padding:7px 14px;background:#FFDC45;color:#061541;font-size:13px;font-weight:700;text-decoration:none;box-shadow:inset 0 2px 0 #FFF0A3, inset 0 -2px 0 #E0B81F;clip-path:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 2px) calc(100% - 4px),calc(100% - 2px) calc(100% - 2px),calc(100% - 4px) calc(100% - 2px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 2px),2px calc(100% - 2px),2px calc(100% - 4px),0 calc(100% - 4px),0 4px,2px 4px,2px 2px,4px 2px);">Demo ↗</a>
                </sc-if>
              </div>
              <div style="grid-column:2;display:flex;flex-direction:column;gap:14px;">
                <p style="margin:0;font-size:16px;line-height:1.6;color:#34466E;text-wrap:pretty;max-width:72ch;">{{ sp.text }}</p>
                <sc-if value="{{ sp.hasTags }}" hint-placeholder-val="{{ true }}">
                  <div style="display:flex;flex-wrap:wrap;gap:8px;">
                    <sc-for list="{{ sp.tags }}" as="t" hint-placeholder-count="2">
                      <span style="padding:4px 9px;background:#EEF2FA;color:#3B63B3;font-size:12px;font-weight:600;line-height:1.3;">{{ t }}</span>
                    </sc-for>
                  </div>
                </sc-if>
              </div>
            </div>
          </section>
        </sc-for>
      </div>
      <sc-for list="{{ project.sections }}" as="s" hint-placeholder-count="0">
        <section style="display:flex;flex-direction:column;gap:16px;">
          <h2 style="margin:0;font-size:31px;font-weight:700;line-height:1.2;color:#061541;">{{ s.title }}</h2>
          <sc-for list="{{ s.blocks }}" as="b" hint-placeholder-count="2">
            <sc-if value="{{ b.isP }}" hint-placeholder-val="{{ true }}">
              <p style="margin:0;font-size:17px;line-height:1.7;color:#34466E;text-wrap:pretty;">{{ b.text }}</p>
            </sc-if>
            <sc-if value="{{ b.isH3 }}" hint-placeholder-val="{{ false }}">
              <h3 style="margin:8px 0 -6px;font-size:21px;font-weight:700;line-height:1.3;color:#061541;">{{ b.text }}</h3>
            </sc-if>
            <sc-if value="{{ b.isImg }}" hint-placeholder-val="{{ false }}">
              <figure style="margin:8px 0 0;display:flex;flex-direction:column;gap:9px;">
                <div role="img" aria-label="{{ b.alt }}" style="width:100%;aspect-ratio:3.5/1;background-image:url({{ b.src }});background-size:cover;background-position:{{ b.pos }};image-rendering:pixelated;"></div>
                <sc-if value="{{ b.hasCaption }}" hint-placeholder-val="{{ true }}">
                  <figcaption style="font-size:13.5px;line-height:1.5;color:#6B7A9C;">{{ b.caption }}</figcaption>
                </sc-if>
              </figure>
            </sc-if>
          </sc-for>
        </section>
      </sc-for>
      <sc-if value="{{ hasLinks }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-wrap:wrap;gap:12px 36px;">
          <sc-for list="{{ project.links }}" as="l" hint-placeholder-count="2">
            <a href="{{ l.href }}" target="{{ l.target }}" style="font-size:17px;font-weight:600;color:#004CE5;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;">{{ l.label }} ↗</a>
          </sc-for>
        </div>
      </sc-if>
    </main>

    <footer style="margin-top:56px;padding-top:18px;border-top:1px solid #A8B3CB;">
      <a href="{{ site.back.href }}" style="display:inline-flex;align-items:center;gap:10px;color:#061541;font-size:15px;font-weight:600;"><span style="font-size:1.2em;line-height:1;">←</span> {{ site.back.label }}</a>
    </footer>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;project&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;transportation&quot;,&quot;tsType&quot;:&quot;'transportation'|'robotics'|'ai-agents'|'small-experiments'&quot;,&quot;options&quot;:[&quot;transportation&quot;,&quot;robotics&quot;,&quot;ai-agents&quot;,&quot;small-experiments&quot;],&quot;section&quot;:&quot;Content&quot;}}">
class Component extends DCLogic {
  state = { data: null };
  async componentDidMount() {
    const mod = await import('./projectData.js');
    this.setState({ data: mod });
  }
  renderVals() {
    const d = this.state.data;
    if (!d) return {};
    const key = new URLSearchParams(location.search).get('project') ?? this.props.project ?? 'transportation';
    const src = d.projects[key] ?? d.projects.transportation;
    const link = (l) => ({ ...l, target: l.newTab ? '_blank' : '_self' });
    const project = {
      ...src,
      categoryName: (src.category || '').split('/').pop().trim(),
      subprojects: (src.subprojects ?? []).map((s, i) => { const off = !s.github; return { ...s, num: String(i + 1).padStart(2, '0'), hasDemo: !!s.demo, tags: s.tags ?? [], hasTags: (s.tags ?? []).length > 0, githubHref: off ? undefined : s.github, githubDisabled: off, githubPointer: off ? 'none' : 'auto', githubColor: off ? '#A8B3CB' : '#004CE5', githubBtnBg: off ? '#E3E6EE' : '#FFDC45', githubBtnColor: off ? '#8A94AD' : '#061541' }; }),
      actions: src.actions.map(link),
      links: src.links.map(link),
      sections: src.sections.map((s) => ({ ...s, blocks: s.blocks.map((b) => ({ ...b, isP: b.type === 'p', isH3: b.type === 'h3', isImg: b.type === 'img', hasCaption: !!b.caption })) })),
    };
    const site = { ...d.siteConfig, nav: d.siteConfig.nav.map((n) => ({ ...n, underline: n.active ? '#FFD43B' : 'transparent' })) };
    return { site, project, hasActions: project.actions.length > 0, hasSummary: !!project.summary, hasLinks: project.links.length > 0 };
  }
}
</script>
</body>
</html>
