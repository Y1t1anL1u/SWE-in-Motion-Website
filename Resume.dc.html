<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#FAF8F0;}
a{color:#004CE5;text-decoration:none;}
a:hover{color:#004CE5;text-decoration:underline;}
</style>
</helmet>
<div data-screen-label="Resume" style="min-height:100vh;background:#FAF8F0;color:#061541;font-family:'Inter',sans-serif;display:flex;flex-direction:column;">
  <div style="padding:0 clamp(24px,4vw,64px);display:flex;flex-direction:column;flex:1;">
    <dc-import name="SiteHeader" active="resume" hint-size="100%,80px"></dc-import>

    <section style="display:flex;align-items:center;justify-content:space-between;gap:24px;padding:36px 0 30px;border-bottom:2px solid #061541;">
      <div style="display:flex;flex-direction:column;gap:14px;">
        <nav aria-label="Breadcrumb" style="display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;font-family:'Inter',sans-serif;font-weight:700;font-size:clamp(10px,0.8vw,13px);letter-spacing:0.08em;text-transform:uppercase;color:#061541;"><a href="Home.dc.html" style="color:#061541;text-decoration:none;" style-hover="text-decoration:underline;">Home</a><span style="color:#A8B3CB;">/</span><span>Resume</span></nav>
        <h1 style="margin:0;font-family:'Pixelify Sans',monospace;font-weight:700;font-size:clamp(40px,4.4vw,72px);line-height:1;">Resume</h1>
      </div>
      <a href="{{ resume.pdf.href }}" download="{{ resume.pdf.filename }}" style="flex:none;display:block;background:#061541;padding:2px;color:#061541;text-decoration:none;clip-path:polygon(5px 0,calc(100% - 5px) 0,calc(100% - 5px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 5px,100% 5px,100% calc(100% - 5px),calc(100% - 2px) calc(100% - 5px),calc(100% - 2px) calc(100% - 2px),calc(100% - 5px) calc(100% - 2px),calc(100% - 5px) 100%,5px 100%,5px calc(100% - 2px),2px calc(100% - 2px),2px calc(100% - 5px),0 calc(100% - 5px),0 5px,2px 5px,2px 2px,5px 2px);" style-hover="filter:brightness(1.04);text-decoration:none;">
        <span style="display:flex;align-items:center;justify-content:center;gap:12px;padding:0 20px;height:44px;background:#FFDC45;box-shadow:inset 0 2px 0 #FFF0A3, inset 0 -2px 0 #E0B81F;font-weight:700;font-size:18px;clip-path:polygon(5px 0,calc(100% - 5px) 0,calc(100% - 5px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 5px,100% 5px,100% calc(100% - 5px),calc(100% - 2px) calc(100% - 5px),calc(100% - 2px) calc(100% - 2px),calc(100% - 5px) calc(100% - 2px),calc(100% - 5px) 100%,5px 100%,5px calc(100% - 2px),2px calc(100% - 2px),2px calc(100% - 5px),0 calc(100% - 5px),0 5px,2px 5px,2px 2px,5px 2px);">{{ resume.pdf.label }} <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#061541" stroke-width="2.4" stroke-linecap="square"><path d="M9 2v13M4 10l5 5 5-5"/></svg></span>
      </a>
    </section>

    <sc-for list="{{ resume.sections }}" as="s" hint-placeholder-count="4">
      <section style="display:grid;grid-template-columns:clamp(150px,14vw,200px) minmax(0,1fr);gap:clamp(24px,3vw,48px);padding:34px 0 38px;border-bottom:2px solid #061541;">
        <h2 style="margin:0;font-family:'Inter',sans-serif;font-weight:700;font-size:clamp(19px,1.5vw,23px);line-height:1.25;letter-spacing:-0.01em;text-wrap:balance;">{{ s.title }}</h2>
        <sc-if value="{{ s.isEntries }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;flex-direction:column;gap:26px;">
            <sc-for list="{{ s.items }}" as="e" hint-placeholder-count="2">
              <div style="display:flex;flex-direction:column;gap:4px;">
                <div style="display:flex;justify-content:space-between;gap:24px;align-items:baseline;">
                  <h3 style="margin:0;font-size:20px;font-weight:700;line-height:1.3;">{{ e.title }}</h3>
                  <sc-if value="{{ e.hasDates }}" hint-placeholder-val="{{ true }}"><span style="flex:none;font-size:19px;color:#34466E;white-space:nowrap;">{{ e.dates }}</span></sc-if>
                </div>
                <sc-if value="{{ e.hasSub }}" hint-placeholder-val="{{ true }}"><div style="font-size:19px;color:#34466E;line-height:1.3;">{{ e.sub }}</div></sc-if>
                <sc-if value="{{ e.hasBullets }}" hint-placeholder-val="{{ false }}">
                  <ul style="margin:8px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:18px;line-height:1.5;color:#34466E;">
                    <sc-for list="{{ e.bullets }}" as="b" hint-placeholder-count="2"><li>{{ b }}</li></sc-for>
                  </ul>
                </sc-if>
                <sc-if value="{{ e.hasText }}" hint-placeholder-val="{{ false }}"><p style="margin:8px 0 0;font-size:18px;line-height:1.5;color:#34466E;">{{ e.text }}</p></sc-if>
                <sc-if value="{{ e.hasLink }}" hint-placeholder-val="{{ false }}"><a href="{{ e.link.href }}" target="_blank" style="align-self:flex-start;margin-top:8px;font-size:18px;font-weight:600;color:#004CE5;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px;">{{ e.link.label }} ↗</a></sc-if>
              </div>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ s.isSkills }}" hint-placeholder-val="{{ false }}">
          <div style="display:grid;grid-template-columns:max-content minmax(0,1fr);gap:14px 32px;font-size:19px;line-height:1.3;">
            <sc-for list="{{ s.items }}" as="k" hint-placeholder-count="3">
              <div style="font-weight:700;">{{ k.label }}</div>
              <div style="color:#34466E;">{{ k.value }}</div>
            </sc-for>
          </div>
        </sc-if>
      </section>
    </sc-for>

    <footer style="margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0 28px;font-weight:700;font-size:13px;">
      <a href="Home.dc.html" style="display:inline-flex;align-items:center;gap:10px;color:#061541;"><span style="font-size:1.3em;line-height:1;">←</span> Back to the board</a>
      <div style="letter-spacing:0.08em;font-weight:400;color:#34466E;">PITTSBURGH · THERE IS ALWAYS A NEXT MOVE</div>
    </footer>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { data: null };
  async componentDidMount() {
    const mod = await import('./resumeData.js');
    this.setState({ data: mod.resume });
  }
  renderVals() {
    const r = this.state.data;
    if (!r) return {};
    const sections = r.sections.map((s) => ({
      ...s,
      isEntries: s.kind === 'entries',
      isSkills: s.kind === 'skills',
      items: s.kind === 'entries' ? s.items.map((e) => ({ ...e, hasDates: !!e.dates, hasSub: !!e.sub, hasBullets: !!(e.bullets && e.bullets.length), hasText: !!e.text, hasLink: !!e.link })) : s.items,
    }));
    return { resume: { ...r, sections } };
  }
}
</script>
</body>
</html>
