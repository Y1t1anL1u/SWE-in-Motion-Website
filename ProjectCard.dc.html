<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
</helmet>
<article style="height:100%;box-sizing:border-box;display:flex;flex-direction:column;background:#061541;padding:2px;clip-path:polygon(6px 0,calc(100% - 6px) 0,calc(100% - 6px) 3px,calc(100% - 3px) 3px,calc(100% - 3px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 3px) calc(100% - 6px),calc(100% - 3px) calc(100% - 3px),calc(100% - 6px) calc(100% - 3px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 3px),3px calc(100% - 3px),3px calc(100% - 6px),0 calc(100% - 6px),0 6px,3px 6px,3px 3px,6px 3px);">
  <div style="flex:1;background:#FBF7ED;padding:5px 5px 0;display:flex;flex-direction:column;clip-path:polygon(6px 0,calc(100% - 6px) 0,calc(100% - 6px) 3px,calc(100% - 3px) 3px,calc(100% - 3px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 3px) calc(100% - 6px),calc(100% - 3px) calc(100% - 3px),calc(100% - 6px) calc(100% - 3px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 3px),3px calc(100% - 3px),3px calc(100% - 6px),0 calc(100% - 6px),0 6px,3px 6px,3px 3px,6px 3px);">
    <div role="img" aria-label="{{ title }}" style="width:100%;aspect-ratio:2.83/1;background-image:url({{ img }});background-size:cover;background-position:center;image-rendering:pixelated;outline:1px solid rgba(7,27,61,0.35);"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:20px;flex:1;min-height:80px;padding:8px 17px 10px;color:#061541;">
      <div style="flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;">
        <h2 style="margin:0;font-family:'Pixelify Sans',monospace;font-weight:700;font-size:34px;line-height:37px;letter-spacing:0;">{{ title }}</h2>
        <sc-if value="{{ hasDesc }}" hint-placeholder-val="{{ true }}"><p style="margin:0;font-family:'Inter',sans-serif;font-weight:400;font-size:20px;line-height:28px;">{{ desc }}</p></sc-if>
      </div>
      <a href="{{ href }}" aria-disabled="{{ isDisabled }}" style="flex:none;display:block;background:{{ btnBorder }};padding:2px;text-decoration:none;color:{{ btnInk }};pointer-events:{{ btnEvents }};cursor:{{ btnCursor }};clip-path:polygon(5px 0,calc(100% - 5px) 0,calc(100% - 5px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 5px,100% 5px,100% calc(100% - 5px),calc(100% - 2px) calc(100% - 5px),calc(100% - 2px) calc(100% - 2px),calc(100% - 5px) calc(100% - 2px),calc(100% - 5px) 100%,5px 100%,5px calc(100% - 2px),2px calc(100% - 2px),2px calc(100% - 5px),0 calc(100% - 5px),0 5px,2px 5px,2px 2px,5px 2px);" style-hover="filter:brightness(1.04);text-decoration:none;">
        <span style="display:flex;align-items:center;justify-content:center;gap:10px;width:120px;height:36px;background:{{ btnBg }};box-shadow:{{ btnShadow }};font-family:'Inter',sans-serif;font-weight:700;font-size:18px;line-height:22px;clip-path:polygon(5px 0,calc(100% - 5px) 0,calc(100% - 5px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 5px,100% 5px,100% calc(100% - 5px),calc(100% - 2px) calc(100% - 5px),calc(100% - 2px) calc(100% - 2px),calc(100% - 5px) calc(100% - 2px),calc(100% - 5px) 100%,5px 100%,5px calc(100% - 2px),2px calc(100% - 2px),2px calc(100% - 5px),0 calc(100% - 5px),0 5px,2px 5px,2px 2px,5px 2px);">Explore <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M2 9h13M10 4l5 5-5 5"/></svg></span>
      </a>
    </div>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:696,&quot;height&quot;:330},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Transportation&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;desc&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Traffic tools and data infrastructure.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;uploads/project-transportation.png&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">class Component extends DCLogic {
  renderVals() {
    const d = !!this.props.disabled;
    return {
      hasDesc: !!this.props.desc,
      isDisabled: d,
      btnBorder: d ? '#9AA3B8' : '#061541',
      btnInk: d ? '#6B7488' : '#061541',
      btnBg: d ? '#E6E8EE' : '#FFDC45',
      btnShadow: d ? 'none' : 'inset 0 2px 0 #FFF0A3, inset 0 -2px 0 #E0B81F',
      btnEvents: d ? 'none' : 'auto',
      btnCursor: d ? 'default' : 'pointer',
    };
  }
}</script>
</body>
</html>
