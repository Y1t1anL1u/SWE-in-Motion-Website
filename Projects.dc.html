<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#FAF8F0;}
a{color:#061541;text-decoration:none;}
a:hover{color:#061541;text-decoration:underline;}
</style>
</helmet>
<div data-screen-label="Projects" style="position:relative;min-height:100vh;font-family:'Inter',sans-serif;color:#061541;background:#FAF8F0;display:flex;flex-direction:column;">

  <div style="padding:0 clamp(24px,4vw,64px);"><dc-import name="SiteHeader" active="projects" hint-size="100%,80px"></dc-import></div>

  <section style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,58%);align-items:start;gap:0;padding:12px clamp(24px,4vw,64px) 0;">
    <div style="display:flex;flex-direction:column;gap:clamp(8px,0.9vw,14px);padding:clamp(14px,1.4vw,22px) 0 clamp(10px,1vw,16px);position:relative;z-index:1;white-space:nowrap;">
      <nav aria-label="Breadcrumb" style="display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;font-family:'Inter',sans-serif;font-weight:700;font-size:clamp(10px,0.8vw,13px);letter-spacing:0.08em;text-transform:uppercase;color:#061541;"><a href="Home.dc.html" style="color:#061541;text-decoration:none;" style-hover="text-decoration:underline;">Home</a><span style="color:#A8B3CB;">/</span><span>Projects</span></nav>
      <h1 style="margin:0;font-family:'Pixelify Sans',monospace;font-weight:700;font-size:clamp(34px,3.6vw,60px);line-height:1;letter-spacing:-0.01em;">Choose your next stop.</h1>
    </div>
    <div role="img" aria-label="Pittsburgh skyline" style="width:100%;height:clamp(100px,8.5vw,140px);background-image:url(uploads/banner-pittsburgh-wide.png);background-size:cover;background-position:center 40%;image-rendering:pixelated;-webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,0.2) 25%,#000 55%);mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,0.2) 25%,#000 55%);"></div>
  </section>

  <section style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:25px;row-gap:15px;padding:clamp(16px,1.6vw,28px) clamp(24px,4vw,64px);">
    <sc-for list="{{ projects }}" as="p" hint-placeholder-count="4">
      <dc-import name="ProjectCard" title="{{ p.title }}" desc="{{ p.desc }}" img="{{ p.img }}" href="{{ p.href }}" disabled="{{ p.disabled }}" hint-size="100%,330px"</dc-import>
    </sc-for>
  </section>

  <footer style="margin-top:auto;margin-left:clamp(24px,4vw,64px);margin-right:clamp(24px,4vw,64px);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:clamp(14px,1.4vw,22px) 0;border-top:2px solid #061541;font-family:'Inter',sans-serif;font-weight:700;font-size:clamp(10px,0.8vw,13px);">
    <a href="Home.dc.html" style="display:inline-flex;align-items:center;gap:10px;"><span style="font-size:1.3em;line-height:1;">←</span> Back to the board</a>
    <div style="letter-spacing:0.08em;opacity:0.85;">PITTSBURGH · THERE IS ALWAYS A NEXT MOVE</div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      projects: [
        { title: 'Transportation', desc: 'Traffic tools and data infrastructure.', img: 'uploads/project-transportation.png', href: 'ProjectDetail.dc.html?project=transportation' },
        { title: 'Robotics', desc: 'Machines that sense, plan, and move.', img: 'uploads/project-robotics.png', href: 'ProjectDetail.dc.html?project=robotics' },
        { title: 'AI Agent', desc: 'Useful agents, grounded in real workflows.', img: 'uploads/project-ai-agents.png', href: 'ProjectDetail.dc.html?project=ai-agents' },
        { title: 'Coming soon', desc: '', img: 'uploads/project-under-construction.png', href: '', disabled: true },
      ],
    };
  }
}
</script>
</body>
</html>
